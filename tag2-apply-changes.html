<script>
(function() {
  // ========================================
  // FIREBASE REMOTE CONFIG - APPLY CHANGES
  // ========================================
  //
  // PURPOSE: Retrieves a value from Firebase Remote Config and applies it to a page element
  // RUNS: After Firebase RC initialization (triggered by 'firebase_rc_ready' event)
  // 
  // ARCHITECTURE NOTE:
  // - Create ONE TAG per parameter/element you want to change
  // - Each tag is independent and can be enabled/disabled separately in GTM
  // - Example: "RC - Button Text", "RC - Headline Color", "RC - Banner Image"
  //
  // ========================================
  
  // ========================================
  // CONFIGURATION - Define what to change
  // ========================================
  
  var featureConfig = {
    
    // =====================================
    // PARAMETER 1: Which Remote Config parameter?
    // =====================================
    parameterName: 'button_addtobasket_text',
    // 
    // WHAT: The name of the parameter in Firebase Remote Config
    // WHERE: Must match the parameter name you created in Firebase Console
    // ALSO: Must match the name in Tag 1's remoteConfigDefaults
    //
    // HOW TO FIND:
    // 1. Go to Firebase Console > Remote Config
    // 2. Look at "Parameter key" column
    // 3. Copy the exact name here
    //
    
    // =====================================
    // PARAMETER 2: What type of value?
    // =====================================
    parameterType: 'string',
    //
    // WHAT: Tells the code how to retrieve the value from Firebase
    // 
    // OPTIONS:
    //   'string'  = Text values (e.g., "Buy Now", "https://example.com/image.jpg")
    //   'boolean' = True/false values (e.g., true, false)
    //   'number'  = Numeric values (e.g., 10, 25.5, 100)
    //
    // RULES:
    // - Must match the data type you set in Firebase Console
    // - String is most common and flexible (can represent anything)
    //
    
    // =====================================
    // PARAMETER 3: Which element to change?
    // =====================================
    elementSelector: 'input.Addtobasket.button.btnAddBasketOnDetail[type="button"]',
    //
    // WHAT: CSS selector that identifies the HTML element to modify
    //
    // HOW TO GET THE SELECTOR:
    // 1. Open your website in Chrome
    // 2. Right-click the element you want to change
    // 3. Click "Inspect" (opens DevTools)
    // 4. In the Elements panel, right-click the highlighted HTML
    // 5. Copy > Copy selector
    // 6. Paste here
    //
    // EXAMPLES:
    //   Button: 'button.add-to-cart'
    //   Heading: 'h1.product-title'
    //   Image: 'img.hero-banner'
    //   Div: 'div#promo-banner'
    //
    // ⚠️ IMPORTANT: If using anti-flicker CSS (see optional code below),
    //    this selector MUST MATCH EXACTLY with the anti-flicker CSS selector
    //
    
    // =====================================
    // PARAMETER 4: What type of change?
    // =====================================
    changeType: 'property',
    //
    // WHAT: Defines how to apply the change to the element
    //
    // OPTIONS:
    //
    //   'property' = Change JavaScript property of the element
    //      Use for: Button text, input values, innerHTML content
    //      Examples: element.value, element.textContent, element.innerHTML
    //
    //   'attribute' = Change HTML attribute
    //      Use for: Image sources, links, data attributes, alt text
    //      Examples: src, href, alt, data-variant, title
    //
    //   'style' = Change CSS style
    //      Use for: Colors, visibility, dimensions, positioning
    //      Examples: color, backgroundColor, display, width
    //
    //   'class' = Add or remove CSS class
    //      Use for: Toggling pre-defined styles, showing/hiding elements
    //      Examples: 'active', 'hidden', 'variant-b'
    //
    
    // =====================================
    // PARAMETER 5: What specifically to change?
    // =====================================
    changeName: 'value',
    //
    // WHAT: The specific property/attribute/style/class to modify
    // DEPENDS ON: The changeType you selected above
    //
    // EXAMPLES BY CHANGE TYPE:
    //
    // If changeType = 'property':
    //   'value'       = For input/button values (e.g., button text)
    //   'textContent' = For element text (no HTML)
    //   'innerHTML'   = For element HTML content
    //   'checked'     = For checkbox state
    //
    // If changeType = 'attribute':
    //   'src'         = For image/iframe sources
    //   'href'        = For link URLs
    //   'alt'         = For image alt text
    //   'data-variant'= For custom data attributes
    //   'title'       = For tooltip text
    //
    // If changeType = 'style':
    //   'color'           = Text color
    //   'backgroundColor' = Background color (camelCase!)
    //   'display'         = Show/hide ('block', 'none')
    //   'fontSize'        = Font size (camelCase!)
    //   'width'           = Width ('100px', '50%')
    //
    // If changeType = 'class':
    //   'active'      = Class name to add/remove
    //   'hidden'      = Class name to toggle
    //   'variant-b'   = A/B test variant class
    //
    // ⚠️ NOTE: For style properties, use camelCase (backgroundColor, not background-color)
    //
    
    // =====================================
    // PARAMETER 6: Fallback value
    // =====================================
    defaultValue: 'Sepete Ekle',
    //
    // WHAT: Value to use if Remote Config fails to load
    // WHY: Ensures your site works even if Firebase is down
    //
    // BEST PRACTICE: Set this to your original website value (before Remote Config)
    // This way, if Firebase fails, users see the normal site experience
    //
    // EXAMPLES:
    //   Button text: 'Add to Cart' (original button text)
    //   Color: '#000000' (original text color)
    //   Image URL: 'https://yoursite.com/original-image.jpg'
    //   Boolean: false (original state)
    //
    
    // =====================================
    // PARAMETER 7: Wait for element?
    // =====================================
    waitForElement: false,
    //
    // WHAT: Should the code wait for the element to appear in the DOM?
    // 
    // WHEN TO USE 'true':
    // - Single Page Applications (React, Vue, Angular)
    // - Elements loaded by AJAX/JavaScript after page load
    // - Dynamically inserted content
    // - Elements inside modals/popups that appear later
    //
    // WHEN TO USE 'false':
    // - Static HTML pages
    // - Elements present in initial page HTML
    // - Traditional server-rendered websites
    //
    // DEFAULT: false (most common case)
    //
    
    // =====================================
    // PARAMETER 8: Maximum wait time
    // =====================================
    maxWaitTime: 5000,
    //
    // WHAT: How long to wait for element to appear (in milliseconds)
    // ONLY APPLIES IF: waitForElement = true
    //
    // RECOMMENDED VALUES:
    //   5000 (5 seconds)   = Standard wait time
    //   10000 (10 seconds) = For slow-loading content
    //   2000 (2 seconds)   = For fast SPAs
    //
    // WHAT HAPPENS AFTER TIMEOUT:
    // - Code stops waiting
    // - Error logged to console
    // - Anti-flicker CSS removed (if enabled)
    // - Page continues normally
    //
    
    // =====================================
    // PARAMETER 9: Custom event name
    // =====================================
    dataLayerEvent: 'rc_change_applied',
    //
    // WHAT: Name of the custom event pushed to dataLayer after applying change
    // WHY: Allows you to track when changes happen and create triggers/tags based on them
    //
    // BEST PRACTICE: Use descriptive names that identify what changed
    //
    // EXAMPLES:
    //   'rc_button_text_changed'
    //   'rc_headline_color_applied'
    //   'rc_banner_image_updated'
    //
    // HOW TO USE IN GTM:
    // 1. Create a Custom Event trigger with this event name
    // 2. Use it to fire tracking tags (GA4 events, etc.)
    // 3. Track which Remote Config changes are being seen by users
    //
    
    // =====================================
    // PARAMETER 10: Remove anti-flicker CSS?
    // =====================================
    removeAntiFlicker: false
    //
    // WHAT: Should this tag remove the anti-flicker style after applying changes?
    // RELATED TO: Optional anti-flicker code (see below)
    //
    // WHEN TO USE 'true':
    // - You added anti-flicker CSS in your website's <head> for this element
    // - You want this tag to control when the element becomes visible
    // - You want fastest possible reveal (immediately after change)
    //
    // WHEN TO USE 'false':
    // - You're NOT using anti-flicker CSS
    // - You're using the hardcoded 3-second timeout instead
    // - Multiple tags might affect the same element
    //
    // DEFAULT: false (safer default - relies on hardcoded timeout failsafe)
    //
    // HOW IT WORKS:
    // - If true: Removes <style id="rc-antiflicker"> immediately after applying change
    // - If false: Leaves removal to the hardcoded setTimeout in anti-flicker code
    //
    // ⚠️ IMPORTANT: The hardcoded anti-flicker code should ALWAYS have a setTimeout
    //    failsafe to prevent elements being hidden forever if this tag fails
    //
  };
  
  // ========================================
  // DO NOT EDIT BELOW THIS LINE
  // ========================================
  // The code below handles applying changes automatically
  // based on the configuration above
  // ========================================
  
  // Function to remove anti-flicker style if enabled
  function removeAntiFlickerStyle() {
    if (featureConfig.removeAntiFlicker) {
      var style = document.getElementById('rc-antiflicker');
      if (style) {
        style.remove();
        console.log('Remote Config: Anti-flicker style removed by tag');
      }
    }
  }
  
  // Function to wait for element to appear in DOM
  function waitForElement(selector, maxWait, callback) {
    var startTime = Date.now();
    var checkInterval = 100; // Check every 100ms
    
    function check() {
      var element = document.querySelector(selector);
      
      if (element) {
        // Element found! Execute callback
        console.log('Remote Config: Element found - ' + selector);
        callback(element);
        return;
      }
      
      // Check if we've exceeded max wait time
      if (Date.now() - startTime < maxWait) {
        // Keep waiting
        setTimeout(check, checkInterval);
      } else {
        // Timeout reached
        console.error('Remote Config: Element not found after ' + maxWait + 'ms: ' + selector);
        removeAntiFlickerStyle(); // Remove anti-flicker to prevent permanent hiding
      }
    }
    
    // Start checking
    check();
  }
  
  // Main function to apply changes
  function applyChanges() {
    // Verify Remote Config is initialized
    if (!window.firebaseRemoteConfigInstanceForGTM) {
      console.error('Remote Config: Not initialized. Make sure Tag 1 (Initialization) fired first.');
      removeAntiFlickerStyle();
      return;
    }
    
    var remoteConfig = window.firebaseRemoteConfigInstanceForGTM;
    
    // Function to apply change to a specific element
    function applyToElement(element) {
      if (!element) {
        console.error('Remote Config: Element not found - ' + featureConfig.elementSelector);
        removeAntiFlickerStyle();
        return;
      }
      
      console.log('Remote Config: Applying changes to element:', element);
      
      // Get value from Remote Config based on parameter type
      var value;
      
      if (featureConfig.parameterType === 'boolean') {
        value = remoteConfig.getBoolean(featureConfig.parameterName);
      } else if (featureConfig.parameterType === 'number') {
        value = remoteConfig.getNumber(featureConfig.parameterName);
      } else {
        // Default to string
        value = remoteConfig.getString(featureConfig.parameterName);
        
        // Use default value if Remote Config returns empty string
        if (!value) {
          value = featureConfig.defaultValue;
          console.log('Remote Config: Using default value (Remote Config returned empty)');
        }
      }
      
      console.log('Remote Config: Retrieved value for "' + featureConfig.parameterName + '" = ' + value);
      
      // Apply change based on changeType
      try {
        if (featureConfig.changeType === 'property') {
          // Change JavaScript property
          element[featureConfig.changeName] = value;
          
        } else if (featureConfig.changeType === 'attribute') {
          // Change HTML attribute
          element.setAttribute(featureConfig.changeName, value);
          
        } else if (featureConfig.changeType === 'style') {
          // Change CSS style
          element.style[featureConfig.changeName] = value;
          
        } else if (featureConfig.changeType === 'class') {
          // Add or remove CSS class based on boolean value
          if (value === true || value === 'true' || value === 1 || value === '1') {
            element.classList.add(featureConfig.changeName);
          } else {
            element.classList.remove(featureConfig.changeName);
          }
        }
        
        console.log('Remote Config: ✓ Successfully applied - ' + 
                   featureConfig.changeType + '.' + featureConfig.changeName + ' = ' + value);
        
        // Remove anti-flicker CSS after successfully applying change
        removeAntiFlickerStyle();
        
        // Push event to dataLayer for tracking
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({
          event: featureConfig.dataLayerEvent,
          rc_parameter: featureConfig.parameterName,
          rc_value: value,
          rc_element: featureConfig.elementSelector,
          rc_change_type: featureConfig.changeType,
          rc_change_name: featureConfig.changeName
        });
        
      } catch (error) {
        console.error('Remote Config: Error applying change', error);
        removeAntiFlickerStyle();
      }
    }
    
    // Wait for element or apply immediately
    if (featureConfig.waitForElement) {
      console.log('Remote Config: Waiting for element - ' + featureConfig.elementSelector);
      waitForElement(featureConfig.elementSelector, featureConfig.maxWaitTime, applyToElement);
    } else {
      var element = document.querySelector(featureConfig.elementSelector);
      applyToElement(element);
    }
  }
  
  // Execute when DOM is ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', applyChanges);
  } else {
    // DOM already loaded
    applyChanges();
  }
})();
</script>
